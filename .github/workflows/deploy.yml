name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 110.8.193.128
          username: gyeong-il
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=/usr/local/bin:/opt/homebrew/bin:$PATH
            source ~/.nvm/nvm.sh
            nvm use 20
            cd /Users/gyeong-il/develop/toto
            git pull origin main
            npm install
            npx prisma migrate deploy
            npx pm2 stop toto || true
            rm -rf .next
            npm run build
            npx pm2 start toto || npx pm2 start npm --name "toto" -- start
            npx pm2 save
